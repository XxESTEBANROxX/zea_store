<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEA STORE · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7FF;--sf:#fff;--sf2:#F0E8FF;--tx:#1A0F2E;--mu:#6B5B85;--pr:#8E2DE2;--gl:#B65CFF;--lv:#D9C2FF;--ok:#12805C;--okbg:#D9F5EA;--no:#B3261E;--nobg:#FBE3E1;--ln:#E3D6F5;--sh:0 1px 3px rgba(26,15,46,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0612;--sf:#1A0F2E;--sf2:#26163F;--tx:#fff;--mu:#B9A7D6;--ok:#5FE0B0;--okbg:#0F3A2C;--no:#FF8A84;--nobg:#45171A;--ln:#32204F;--sh:0 0 0 rgba(0,0,0,0)}}
:root[data-theme="dark"]{--bg:#0B0612;--sf:#1A0F2E;--sf2:#26163F;--tx:#fff;--mu:#B9A7D6;--ok:#5FE0B0;--okbg:#0F3A2C;--no:#FF8A84;--nobg:#45171A;--ln:#32204F;--sh:0 0 0 rgba(0,0,0,0)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
:focus-visible{outline:2px solid var(--gl);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:.01em;margin-right:auto}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#000;box-shadow:0 0 0 2px var(--pr),0 0 16px var(--gl)}
.search{order:3;flex:1 1 100%}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:0 18px;font:inherit;font-size:.95rem}
.search input::placeholder{color:var(--mu)}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-size:1.15rem;cursor:pointer}
@media (min-width:720px){.search{order:0;flex:0 1 420px}.bar{flex-wrap:nowrap}.brand{margin-right:0}.search{margin-left:auto}}
main{padding-top:24px;padding-bottom:48px}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.lead{margin:0 0 20px;color:var(--mu);max-width:56ch}
.filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex:1 1 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip,.seg button{font:inherit;font-size:.9rem;font-weight:600;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--pr);border-color:var(--pr);color:#fff}
.seg{display:flex;gap:6px}
.count{color:var(--mu);font-size:.85rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
@media (min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:10px;display:flex;flex-direction:column;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--gl);box-shadow:0 0 18px rgba(182,92,255,.35)}
.tile{aspect-ratio:1;border-radius:12px;background:linear-gradient(145deg,var(--sf2),var(--sf));display:grid;place-items:center;font-size:clamp(2.6rem,9vw,3.6rem);border:1px solid var(--ln)}
.info{padding:10px 4px 4px;display:flex;flex-direction:column;gap:6px;flex:1}
.brandn{font-size:.78rem;color:var(--mu);font-weight:600}
.name{font-size:1rem;font-weight:600;line-height:1.25;margin:0}
.badge{align-self:flex-start;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--okbg);color:var(--ok)}
.badge.off{background:var(--nobg);color:var(--no)}
.wa{margin-top:auto;display:block;text-align:center;text-decoration:none;font-weight:600;font-size:.88rem;background:var(--pr);color:#fff;border-radius:999px;padding:10px 12px}
.wa:hover{background:var(--gl);color:#0B0612}
.wa.alt{background:transparent;color:var(--tx);border:1px solid var(--pr)}
.empty{grid-column:1/-1;text-align:center;padding:40px 12px;color:var(--mu)}
footer{border-top:1px solid var(--ln);padding:24px 0;color:var(--mu);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 32px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header class="top"><div class="wrap bar">
  <a class="brand" href="#"><img class="logo" src="/logo.jpg" alt="Logo de ZEA STORE"><span>ZEA STORE</span></a>
  <label class="search"><input id="q" type="search" placeholder="Buscar celulares, accesorios, marcas…" aria-label="Buscar productos"></label>
  <button id="th" class="ic" type="button" aria-label="Cambiar entre modo claro y oscuro"></button>
</div></header>
<main class="wrap">
  <h1>Catálogo</h1>
  <p class="lead">Celulares, accesorios y tecnología. Escríbenos por WhatsApp para conocer el precio y la disponibilidad de cada producto.</p>
  <div class="filters">
    <div class="chips" id="cats" role="group" aria-label="Categorías"></div>
    <div class="seg" id="avail" role="group" aria-label="Disponibilidad"></div>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <section class="grid" id="grid"></section>
</main>
<footer><div class="wrap">
  <span>WhatsApp: pendiente de configurar</span>
  <span>Dirección: pendiente de configurar</span>
  <span>Horario: pendiente de configurar</span>
</div></footer>
<script>
var WA_NUMBER = {{ wa_number|tojson }};
var CATS = {{ categorias|tojson }};
var AV = ["Todos","Disponible","Agotado"];
var P = {{ productos|tojson }}.map(function(x){return {n:x.nombre,b:x.marca,c:x.categoria,e:x.emoji,ok:x.disponible}});
var S = {cat:"Todos",av:"Todos",q:""};
function $(i){return document.getElementById(i)}
function btns(box,list,key,cls){
  box.innerHTML="";
  list.forEach(function(t){
    var b=document.createElement("button");b.type="button";b.textContent=t;
    if(cls)b.className=cls;
    b.setAttribute("aria-pressed",S[key]===t);
    b.onclick=function(){S[key]=t;draw()};
    box.appendChild(b);
  });
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function draw(){
  btns($("cats"),CATS,"cat","chip");btns($("avail"),AV,"av");
  var q=norm(S.q);
  var r=P.filter(function(p){
    return (S.cat==="Todos"||p.c===S.cat)&&(S.av==="Todos"||(S.av==="Disponible")===p.ok)&&(!q||norm(p.n+" "+p.b+" "+p.c).indexOf(q)>-1);
  });
  $("count").textContent=r.length+(r.length===1?" producto":" productos");
  $("grid").innerHTML=r.length?r.map(function(p){
    var msg=encodeURIComponent("Hola, quiero información sobre: "+p.n+" ("+p.b+")");
    return '<article class="card"><div class="tile" aria-hidden="true">'+p.e+'</div><div class="info"><span class="brandn">'+p.b+'</span><h2 class="name">'+p.n+'</h2><span class="badge'+(p.ok?'':' off')+'">'+(p.ok?'Disponible':'Agotado')+'</span><a class="wa'+(p.ok?'':' alt')+'" target="_blank" rel="noopener" href="https://wa.me/'+WA_NUMBER+'?text='+msg+'">'+(p.ok?'Consultar por WhatsApp':'Preguntar cuándo llega')+'</a></div></article>';
  }).join(""):'<p class="empty">No encontramos productos con esos filtros. Prueba otra categoría o escríbenos por WhatsApp.</p>';
}
$("q").oninput=function(){S.q=this.value;draw()};
function dark(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches}
function icon(){$("th").textContent=dark()?"☀️":"🌙"}
$("th").onclick=function(){
  var n=dark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);
  try{localStorage.setItem("zea-theme",n)}catch(e){}
  icon();
};
try{var s=localStorage.getItem("zea-theme");if(s)document.documentElement.setAttribute("data-theme",s)}catch(e){}
icon();draw();
</script>
</body></html>
