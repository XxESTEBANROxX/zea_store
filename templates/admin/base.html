<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block titulo %}Panel{% endblock %} · ZEA STORE</title>

  <!-- Ícono de la pestaña -->
  <link rel="icon" href="/zea_store_favicon.ico" type="image/x-icon">

  <!-- Tipografía (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">

  <!-- Íconos (Font Awesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Colores y componentes compartidos del panel -->
  <link rel="stylesheet" href="/css/admin/base.css">

  <!-- Estilos propios de cada página -->
  {% block estilos %}{% endblock %}
</head>

<body>

  {% block cuerpo %}{% endblock %}

  <!-- Modo claro / oscuro (compartido) -->
  <script src="/js/admin/tema.js"></script>

  <!-- Lógica propia de cada página -->
  {% block scripts %}{% endblock %}

</body>
</html>
